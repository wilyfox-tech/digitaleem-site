# Builds the WordPress theme on every push to main, publishes it to the "theme" branch,
# and uploads it to Hostinger over FTP when the FTP secrets are set
# (repo Settings > Secrets and variables > Actions: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, optional FTP_DIR).
name: Build and deploy WordPress theme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/build.js wp
      - name: Clean up the FTP server name
        if: env.HAS_FTP == 'true'
        id: ftp
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          host=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^s?ftps?://##; s#[/:].*$##')
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - name: Upload to Hostinger over FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wordpress/digitaleem/
          server-dir: ${{ secrets.FTP_DIR || '/public_html/wp-content/themes/digitaleem/' }}
      - name: Publish to the theme branch
        run: |
          cd wordpress/digitaleem
          git init -q -b theme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Theme built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" theme
